# 選擇 Jekyll 預設主題 (推薦 minima，簡潔適合閱讀)
theme: minima
baseurl: "/money-snap"
url: "https://tzuchienkao.github.io"
timezone: Asia/Taipei

title: 幫你算兌 Money Snap - 開發筆記
description: 紀錄與 AI 協作開發產品的生命週期與思考過程

# 網址格式設定
permalink: /:year/:month/:day/:title.html
future: true

# 外掛設定
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Markdown 渲染設定 (預設即支援程式碼高亮與 Mermaid 樣式)
markdown: kramdown
highlighter: rouge

jekyll:
  environment: production